# ProxiCore POINT — Windows EXE packaging (electron-builder)
# Usage (on Windows or CI):
#   npm run build
#   npm install -D electron electron-builder
#   npx electron-builder --win --publish never
appId: site.proxicore.point
productName: ProxiCore POINT
copyright: Copyright © 2026 ProxiCore
files:
  - dist/**/*
  - electron/**/*
  - package.json
extraMetadata:
  main: electron/main.cjs
directories:
  output: release
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ProxiCore-POINT-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ProxiCore POINT
