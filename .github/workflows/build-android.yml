name: Build Android APK

on:
  push:
    branches: ["main", "arena/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" .
          git checkout "${{ github.sha }}"

      - name: Ensure Node 20.19+
        run: |
          node --version
          NODE_MAJOR=$(node -p 'process.versions.node.split(".")[0]')
          NODE_MINOR=$(node -p 'process.versions.node.split(".")[1]')
          if [ "$NODE_MAJOR" -lt 20 ] || { [ "$NODE_MAJOR" -eq 20 ] && [ "$NODE_MINOR" -lt 19 ]; }; then
            echo "Runner Node too old — installing Node 22 LTS"
            curl -fsSL https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.xz -o /tmp/node.tar.xz
            mkdir -p /tmp/node22
            tar -xJf /tmp/node.tar.xz -C /tmp/node22 --strip-components=1
            echo "/tmp/node22/bin" >> "$GITHUB_PATH"
          fi

      - name: Install web dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Capacitor sync (copy web assets into android shell)
        run: npx cap sync android

      - name: Build debug APK with Gradle (with failure diagnostics)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          export PATH="$JAVA_HOME/bin:$PATH"
          echo "JAVA_HOME=$JAVA_HOME"; java -version
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "No Android SDK on runner — installing from dl.google.com"
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/ct.zip
            unzip -q /tmp/ct.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          fi
          export ANDROID_HOME="$SDK"
          echo "sdk.dir=$SDK" > android/local.properties
          echo "SDK contents:"; ls "$SDK"; ls "$SDK/platforms" 2>/dev/null; ls "$SDK/build-tools" 2>/dev/null
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1
          fi
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::Gradle build failed (exit $STATUS) — publishing diagnostics to ci-debug branch"
            cd ..
            {
              echo "=== gradle tail ==="
              tail -250 /tmp/gradle.log
              echo "=== env ==="
              echo "JAVA_HOME=$JAVA_HOME ANDROID_HOME=$ANDROID_HOME"
              java -version 2>&1
              echo "=== sdk dir ==="
              ls -la "$SDK" 2>/dev/null
              ls "$SDK/platforms" 2>/dev/null
              ls "$SDK/build-tools" 2>/dev/null
            } > ci-debug.txt
            gh release delete ci-debug --yes --cleanup-tag > /dev/null 2>&1
            gh release create ci-debug ci-debug.txt \
              --title "CI diagnostics (gradle failed)" \
              --notes "Gradle failed (exit $STATUS) — run ${{ github.run_id }}, sha ${{ github.sha }}"
            echo "diag release rc=$?"
            exit "$STATUS"
          fi
          set -e

      - name: Publish APK as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          cp "$APK" ProxiCore-POINT-debug.apk
          gh release delete latest-apk --yes --cleanup-tag 2>/dev/null || true
          gh release create latest-apk ProxiCore-POINT-debug.apk \
            --title "ProxiCore POINT — latest debug APK" \
            --notes "Built from ${{ github.sha }} by run ${{ github.run_id }} on $(date -u +%Y-%m-%dT%H:%M:%SZ). Debug-signed; install over any previous build."
          echo "Published to release latest-apk"

      - name: Fallback — publish APK as alternate release (only if primary failed)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$APK" ]; then
            cp "$APK" ProxiCore-POINT-debug.apk
            gh release delete apk-fallback --yes --cleanup-tag > /dev/null 2>&1
            gh release create apk-fallback ProxiCore-POINT-debug.apk \
              --title "ProxiCore POINT — debug APK (fallback)" \
              --notes "Run ${{ github.run_id }}, sha ${{ github.sha }}"
          fi
